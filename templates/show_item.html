<!DOCTYPE html>
<html>

<head>
  <title>{{ item.title}}</title>
</head>

<body>
    <h1>{{ item.title}}</h1>
     {% if session.user_id==item.user_id %}
    <p>
    <a href="/edit_item/{{ item.id }}">Muokkaa</a>
    {% endif %}
    <p>
        Artisti: {{item.artist}}
    </p>
    
    <p>
        Arvosana: {{item.rating}}
    </p>
    <p>
        {{item.comment}}
    </p>
    <p>
        Käyttäjä: {{item.username}}
    </p>
    <p>
        <a href="/">Takaisin</a>
    </p>
</body>

</html>
